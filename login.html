<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تسجيل الدخول | العلّامة</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #075c3c;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 15px 40px #0004;
    }

    h1 {
      text-align: center;
      color: #075c3c;
      margin-bottom: 8px;
    }

    p {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 18px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #075c3c;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      color: #d00;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>العلّامة</h1>
    <p>تسجيل دخول الطالب</p>

    <form id="loginForm">

      <label>البريد الإلكتروني</label>

      <input
        type="email"
        id="email"
        placeholder="البريد الإلكتروني"
        required
      >

      <label>كلمة المرور</label>

      <input
        type="password"
        id="password"
        placeholder="كلمة المرور"
        required
      >

      <button type="submit">
        تسجيل الدخول
      </button>

      <div id="message"></div>

    </form>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <script>

    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function(e) {

      e.preventDefault();

      message.textContent = "جاري تسجيل الدخول...";

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {

        message.textContent = "البريد الإلكتروني أو كلمة المرور غير صحيحة";

        return;
      }

      window.location.href = "index.html";

    });

  </script>

</body>
</html>
