<style>
:root{--bg:#eef3ef;--card:#fff;--ink:#23363a;--mute:#6b7f82;--line:#d9e4e1;--pri:#1d6b38;--pri-ink:#fff;--soft:#dfece3;--sky:#dce9f4;--sand:#f1e8d4;--bad:#b4534b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15201f;--card:#1e2c2b;--ink:#e6efed;--mute:#9bb0ad;--line:#2f4240;--pri:#6fbf8a;--pri-ink:#10201e;--soft:#26402f;--sky:#233647;--sand:#3a3626;--bad:#e0847b}}
:root[data-theme="dark"]{--bg:#15201f;--card:#1e2c2b;--ink:#e6efed;--mute:#9bb0ad;--line:#2f4240;--pri:#6fbf8a;--pri-ink:#10201e;--soft:#26402f;--sky:#233647;--sand:#3a3626;--bad:#e0847b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,Arial,sans-serif;line-height:1.7}
button,input,select{font:inherit;color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:10px 16px}
.logo{font-weight:800;font-size:20px}.logo small{font-weight:400;color:var(--mute);font-size:13px}
nav{display:flex;gap:4px}
nav a{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;color:var(--mute);text-decoration:none;font-weight:600;font-size:15px}
nav svg,.sbtn svg{width:20px;height:20px;flex:none}
.logo{display:flex;align-items:center;gap:10px}.logo img{width:44px;height:44px;border-radius:11px;display:block}.logo span{display:block;line-height:1.2}.logo small{display:block;margin:0}
.sbtn{margin-inline-start:auto;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center}
.sbtn.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.sp{position:fixed;top:calc(env(safe-area-inset-top,0px) + 66px);inset-inline:0;margin:auto;width:min(560px,94vw);z-index:8;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:0 8px 28px rgba(0,0,0,.14);display:none}
.sp.open{display:block}.sp input{width:100%}
.sr{max-height:50vh;overflow:auto}.sr button{display:flex;justify-content:space-between;width:100%;background:none;border:0;padding:9px 6px;border-bottom:1px solid var(--line);cursor:pointer;text-align:start}.sr small{color:var(--mute)}
nav a.on{background:var(--soft);color:var(--ink)}
#nav2{display:none!important}
@media(max-width:640px){#nav2{display:flex!important}header{display:none}nav{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--line);justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
nav a{flex-direction:column;gap:0;font-size:12px;padding:4px 12px}
.mhead{display:flex!important}main{padding-bottom:84px!important}}
.mhead{display:none;align-items:center;gap:10px;padding:10px 16px;font-weight:800;font-size:20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
main{max-width:1000px;margin:0 auto;padding:18px 16px 40px}
h1,h2,h3{margin:0}h2{font-size:20px;margin-bottom:12px}
.hero{background:var(--soft);border-radius:22px;padding:28px 22px;margin-bottom:18px}
.hero h1{font-size:clamp(34px,8vw,56px);font-weight:800;line-height:1.2}
.hero p{color:var(--mute);max-width:46ch;margin:8px 0 16px}
.btn{background:var(--pri);color:var(--pri-ink);border:0;border-radius:12px;padding:9px 18px;font-weight:600;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:3px 10px;font-size:13px;border-radius:8px}
.btn:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:24px}.stat span{color:var(--mute);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.cover{height:84px;border-radius:12px;margin-bottom:12px;display:flex;align-items:flex-end;padding:8px 12px;font-weight:800;font-size:18px}
.meta{color:var(--mute);font-size:13px;display:flex;justify-content:space-between;margin:6px 0 12px}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
.note{background:var(--sand);border-radius:14px;padding:12px 16px;margin-bottom:22px}
.bar-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
input,select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0}
.tools-s{flex:1;min-width:160px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:16px}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);font-size:14px;white-space:nowrap}
th{color:var(--mute);font-weight:600;background:var(--bg)}
tr:last-child td{border-bottom:0}
.tag{padding:2px 10px;border-radius:12px;font-size:12px;background:var(--soft)}.tag.off{background:var(--sand);color:var(--bad)}
.link{background:none;border:0;padding:0;cursor:pointer;font-weight:600;text-decoration:underline}
.prof{display:flex;gap:16px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.av{width:72px;height:72px;border-radius:50%;background:var(--sky);display:grid;place-items:center;font-size:30px;font-weight:800}
dialog{border:0;border-radius:18px;background:var(--card);color:var(--ink);width:min(440px,92vw);padding:20px}
dialog::backdrop{background:rgba(20,30,30,.5)}
label{display:block;font-size:13px;color:var(--mute);margin-top:10px}label+input,label+select{width:100%}
.err{color:var(--bad);font-size:13px;min-height:20px;margin-top:8px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
ul.ls{list-style:none;padding:0;margin:0}ul.ls li{padding:9px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.empty{padding:28px;text-align:center;color:var(--mute)}
#toast{position:fixed;inset-inline:0;bottom:90px;margin:auto;width:max-content;max-width:90vw;background:var(--ink);color:var(--bg);padding:8px 18px;border-radius:20px;display:none;z-index:20}
</style>

function home(){var act=S.filter(function(s){return s.status}).length;

function profile(){var s=byId(cur);if(!s)return'<div class="empty">لا يوجد طالب محدد. اختر طالبًا من قائمة الطلاب.</div>';
var cs=s.courses.map(function(id){var c=COURSES.filter(function(x){return x.id===id})[0],p=s.prog[id]||0;return'<div class="card"><b>'+esc(c.t)+'</b><div class="meta"><span>'+esc(c.g)+'</span><span>'+p+'%</span></div><div class="bar"><i style="width:'+p+'%"></i></div></div>'}).join("")||'<div class="empty">لا توجد اشتراكات بعد.</div>';
return'<div class="prof"><div class="av">'+esc(s.name.charAt(0))+'</div><div><h2 style="margin:0">'+esc(s.name)+'</h2><div class="meta" style="gap:12px;justify-content:flex-start"><span>'+esc(s.grade)+'</span><span>كود: '+esc(s.code)+'</span><span>'+esc(s.phone)+'</span><span>ولي الأمر: '+esc(s.parent)+'</span></div></div><button class="btn alt" style="margin-inline-start:auto" onclick="editDlg()">تعديل بياناتي</button></div><h2>كورساتي</h2><div class="grid">'+cs+'</div>'}
function students(){var list=S.filter(function(s){return(!q||(s.name+s.code+s.phone).indexOf(q)>-1)&&(!gf||s.grade===gf)});
var rows=list.map(function(s){return'<tr><td><button class="link" onclick="openProf('+s.id+')">'+esc(s.name)+'</button></td><td>'+esc(s.grade)+'</td><td>'+esc(s.phone)+'</td><td>'+esc(s.code)+'</td><td>'+esc(s.date)+'</td><td><span class="tag'+(s.status?"":" off")+'">'+(s.status?"نشط":"موقوف")+'</span></td><td><button class="btn alt sm" onclick="tog('+s.id+')">'+(s.status?"إيقاف":"تفعيل")+'</button> <button class="btn alt sm" onclick="del('+s.id+')">'+(pend===s.id?"تأكيد الحذف؟":"حذف")+'</button></td></tr>'}).join("");
return'<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><h2>الطلاب ('+S.length+')</h2><button class="btn" onclick="addDlg()">إضافة طالب جديد</button></div><div class="bar-tools"><input class="tools-s" id="sq" placeholder="ابحث بالاسم أو الكود أو الهاتف" value="'+esc(q)+'" oninput="q=this.value;keep()"><select onchange="gf=this.value;render()"><option value="">كل الصفوف</option>'+GRADES.map(function(g){return'<option'+(gf===g?" selected":"")+'>'+g+'</option>'}).join("")+'</select></div><div class="tw"><table><thead><tr><th>الاسم</th><th>الصف</th><th>الهاتف</th><th>الكود</th><th>التسجيل</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody>'+(rows||'<tr><td colspan="7" class="empty">لا يوجد طلاب مطابقون.</td></tr>')+'</tbody></table></div>'}
function keep(){var p=document.getElementById("sq").selectionStart;render();var e=document.getElementById("sq");e.focus();e.setSelectionRange(p,p)}
function editDlg(){var s=byId(cur);if(!s)return;var d=document.getElementById("dlg");
d.innerHTML='<h3>تعديل بياناتي</h3><label for="e1">الاسم</label><input id="e1" value="'+esc(s.name)+'"><label for="e2">الصف</label><select id="e2">'+GRADES.map(function(g){return'<option'+(g===s.grade?" selected":"")+'>'+g+'</option>'}).join("")+'</select><label for="e3">هاتف الطالب</label><input id="e3" inputmode="numeric" maxlength="11" value="'+esc(s.phone)+'"><label for="e4">هاتف ولي الأمر</label><input id="e4" inputmode="numeric" maxlength="11" value="'+esc(s.parent)+'"><div class="err" id="er"></div><div class="row"><button class="btn alt" onclick="dlg.close()">إلغاء</button><button class="btn" onclick="saveEdit()">حفظ التعديلات</button></div>';d.showModal()}
function saveEdit(){var s=byId(cur),n=e1.value.trim(),ph=e3.value.trim(),pa=e4.value.trim(),re=/^01[0125][0-9]{8}$/,er=document.getElementById("er");
if(n.length<3){er.textContent="اكتب الاسم ثلاثة أحرف على الأقل.";return}
if(!re.test(ph)){er.textContent="هاتف الطالب لازم يكون 11 رقم ويبدأ بـ 01.";return}
if(!re.test(pa)){er.textContent="هاتف ولي الأمر لازم يكون 11 رقم ويبدأ بـ 01.";return}
if(S.some(function(x){return x.phone===ph&&x.id!==s.id})){er.textContent="رقم الهاتف مسجّل لطالب آخر.";return}
s.name=n;s.grade=e2.value;s.phone=ph;s.parent=pa;save();dlg.close();toast("تم حفظ التعديلات");render()}
function openProf(id){cur=id;save();location.hash="#/profile"}
function tog(id){var s=byId(id);s.status=s.status?0:1;save();render()}
function del(id){if(pend===id){S=S.filter(function(s){return s.id!==id});if(cur===id)cur=S.length?S[0].id:0;pend=null;save();toast("تم حذف الطالب")}else{pend=id;setTimeout(function(){if(pend===id){pend=null;render()}},3000)}render()}
function addDlg(){var d=document.getElementById("dlg");
d.innerHTML='<h3>إضافة طالب جديد</h3><label for="f1">الاسم</label><input id="f1"><label for="f2">الصف</label><select id="f2">'+GRADES.map(function(g){return'<option>'+g+'</option>'}).join("")+'</select><label for="f3">هاتف الطالب</label><input id="f3" inputmode="numeric" maxlength="11" placeholder="01xxxxxxxxx"><label for="f4">هاتف ولي الأمر</label><input id="f4" inputmode="numeric" maxlength="11" placeholder="01xxxxxxxxx"><div class="err" id="er"></div><div class="row"><button class="btn alt" onclick="dlg.close()">إلغاء</button><button class="btn" onclick="addS()">حفظ الطالب</button></div>';d.showModal()}
function addS(){var n=f1.value.trim(),ph=f3.value.trim(),pa=f4.value.trim(),re=/^01[0125][0-9]{8}$/,er=document.getElementById("er");
if(n.length<3){er.textContent="اكتب الاسم ثلاثة أحرف على الأقل.";return}
if(!re.test(ph)){er.textContent="هاتف الطالب لازم يكون 11 رقم ويبدأ بـ 01.";return}
if(!re.test(pa)){er.textContent="هاتف ولي الأمر لازم يكون 11 رقم ويبدأ بـ 01.";return}
if(S.some(function(s){return s.phone===ph})){er.textContent="رقم الهاتف مسجّل لطالب آخر.";return}
var id=S.reduce(function(m,s){return Math.max(m,s.id)},0)+1;
S.push({id:id,name:n,grade:f2.value,phone:ph,parent:pa,code:"H"+(1000+id),status:1,courses:[],prog:{},date:new Date().toISOString().slice(0,10)});
save();dlg.close();toast("تمت إضافة الطالب");render()}
function render(){var r=route(),v={home:home,courses:courses,profile:profile,students:students}[r]||home;
document.getElementById("app").innerHTML=v();nav();sbtns()}
window.addEventListener("hashchange",function(){window.scrollTo(0,0);render()});
render();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
